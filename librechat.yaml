version: 1.3.11
cache: true
fileStrategy: 'local'
registration:
  socialLogins: []
interface:
  contextUsage: true
  contextCost: true
balance:
  enabled: true
  startBalance: 100000000000
  autoRefillEnabled: false
fileConfig:
  endpoints:
    agents:
      fileLimit: 20
    default:
      fileLimit: 20
endpoints:
  custom:
    - name: 'ChatGPT'
      apiKey: '${OPENAI_CUSTOM_KEY}'
      baseURL: 'https://api.openai.com/v1'
      models:
        default: ['gpt-6.1-terra']
        fetch: true
      titleConvo: true
      titleModel: 'gpt-6.1-terra'
      modelDisplayLabel: 'ChatGPT'
      tokenConfig:
        gpt-6.2-sol:
          prompt: 2
          completion: 10
          context: 1050000
        gpt-6.1-terra:
          prompt: 1
          completion: 5
          context: 1050000

    - name: 'Claude'
      provider: 'anthropic'
      apiKey: '${ANTHROPIC_CUSTOM_KEY}'
      baseURL: 'https://api.anthropic.com'
      headers:
        anthropic-version: '2023-06-01'
      models:
        default:
          - 'claude-sonnet-5-5'
        fetch: false
      titleConvo: true
      titleModel: 'claude-sonnet-5-5'
      modelDisplayLabel: 'Claude'
      tokenConfig:
        claude-sonnet-5-5:
          prompt: 2
          completion: 10
          context: 1000000
          cacheRead: 0.2
          cacheWrite: 2.5
          cacheWrite1h: 4

mcpSettings:
  allowedAddresses:
    - 'docx-mcp.railway.internal:8080'

mcpServers:
  docx:
    type: streamable-http
    url: 'http://docx-mcp.railway.internal:8080/mcp'
    headers:
      Authorization: 'Bearer ${DOCX_MCP_AUTH_TOKEN}'
    requiresOAuth: false
    timeout: 120000
