version: 1.3.11
cache: true
fileStrategy: 'local'
registration:
  socialLogins: []
interface:
  contextUsage: true
  contextCost: true
fileConfig:
  endpoints:
    agents:
      fileLimit: 20
    default:
      fileLimit: 20
endpoints:
  custom:
    - name: 'ChatGPT'
      apiKey: '${OPENAI_CUSTOM_KEY}'
      baseURL: 'https://api.openai.com/v1'
      models:
        default: ['gpt-5.6-terra']
        fetch: true
      titleConvo: true
      titleModel: 'gpt-5.6-terra'
      modelDisplayLabel: 'ChatGPT'
      tokenConfig:
        gpt-6.1-sol:
          prompt: 2
          completion: 10
          context: 1050000

    - name: 'Claude'
      provider: 'anthropic'
      apiKey: '${ANTHROPIC_CUSTOM_KEY}'
      baseURL: 'https://api.anthropic.com'
      headers:
        anthropic-version: '2023-06-01'
      models:
        default:
          - 'claude-sonnet-5-5'
        fetch: false
      titleConvo: true
      titleModel: 'claude-sonnet-5-5'
      modelDisplayLabel: 'Claude'
      tokenConfig:
        claude-sonnet-5-5:
          prompt: 2
          completion: 10
          context: 1000000
          cacheRead: 0.2
          cacheWrite: 2.5
          cacheWrite1h: 4
