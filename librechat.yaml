version: 1.3.11
cache: true
fileStrategy: 'local'
registration:
  socialLogins: []
endpoints:
  custom:
    - name: 'Claude'
      provider: 'anthropic'
      apiKey: '${ANTHROPIC_CUSTOM_KEY}'
      baseURL: 'https://api.anthropic.com'
      headers:
        anthropic-version: '2023-06-01'
      models:
        default:
          - 'claude-sonnet-5'
          - 'claude-haiku-4-5-20251001'
          - 'claude-sonnet-4-6'
        fetch: false
      titleConvo: true
      titleModel: 'claude-haiku-4-5-20251001'
      modelDisplayLabel: 'Claude'

    - name: 'ChatGPT'
      apiKey: '${OPENAI_CUSTOM_KEY}'
      baseURL: 'https://api.openai.com/v1'
      models:
        default: ['gpt-5.6-terra']
        fetch: true
      titleConvo: true
      titleModel: 'gpt-5.6-terra'
      modelDisplayLabel: 'ChatGPT'
