version: 1.3.11

cache: true

fileStrategy: 'local'

registration:
  socialLogins: []

endpoints:
  anthropic:
    models:
      - "claude-opus-5"
      - "claude-sonnet-5"

  custom:
    - name: "Google"
      apiKey: "${GOOGLE_KEY}"
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      models:
        default:
          - "gemini-3.6-flash"
          - "gemini-3.1-flash-lite"
          - "gemini-3.1-pro-preview"
        fetch: false
      titleConvo: true
      modelDisplayLabel: "Google"
